[program:attendance-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/mtan/artisan queue:work database --queue=attendance --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/path/to/mtan/storage/logs/queue-worker.log
stopwaitsecs=3600

; Environment variables
environment=
    APP_ENV=production,
    QUEUE_CONNECTION=database,
    DB_CONNECTION=mysql,
    DB_HOST=127.0.0.1,
    DB_DATABASE=attendance_central,
    DB_USERNAME=root,
    DB_PASSWORD=secret
