[program:mqtt-consumer]
process_name=%(program_name)s
command=php /path/to/your/project/artisan mqtt:consume
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/mqtt-consumer.log
stopwaitsecs=3600
